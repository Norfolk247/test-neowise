<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <pre id="result" aria-live="polite"></pre>
<script type="module">
  const form = document.querySelector("form");
  const result = document.querySelector("#result");
  const message = document.querySelector("#message");
  const button = form.querySelector("button");

  const topics = {
    delivery: "Доставка",
    pricing: "Цены и стоимость",
    other: "Другой вопрос",
  };

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    // Clear stale results before a new request.
    result.textContent = "";
    button.disabled = true;
    button.textContent = "Обработка...";

    try {
      const response = await fetch("/api/triage", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          text: message.value,
        }),
      });

      const data = await response.json();

      if (!response.ok || data.status === "invalid_input") {
        result.textContent = "Введите текст заявки.";
        return;
      }

      if (data.status === "manual_review") {
        result.textContent =
          "Не удалось автоматически обработать заявку. " +
          "Пожалуйста, проверьте её вручную.";
        return;
      }

      if (data.status === "ready") {
        result.textContent =
          `Тема: ${topics[data.topic]}\n\n` +
          `Черновик ответа:\n${data.draft}`;
        return;
      }

      result.textContent = "Произошла непредвиденная ошибка.";
    } catch {
      result.textContent =
        "Не удалось связаться с сервером. Попробуйте ещё раз.";
    } finally {
      button.disabled = false;
      button.textContent = "Разобрать заявку";
    }
  });
</script>

</body>
</html>
